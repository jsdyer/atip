name: Publish ATIP Explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/**'
      - 'scripts/**'
      - 'tool.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    # Daily at 10:23 UTC (02:23 PST / 03:23 PDT in Vancouver).
    - cron: '23 10 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Download the federal ATI summaries and build
        run: |
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            'https://open.canada.ca/data/dataset/0797e893-751e-4695-8229-a5066e4fe43c/resource/19383ca2-b01a-487d-88f7-e1ffbc7d39c2/download/ati-all.csv' \
            --output "$RUNNER_TEMP/ati-all.csv"
          python3 scripts/build.py "$RUNNER_TEMP/ati-all.csv"
          test -s dist/index.html
          test -s dist/data/manifest.json
      - name: Test application logic
        run: node --test tests/*.test.mjs
      - name: Test snapshot metadata
        run: python3 -m unittest discover -s tests -v
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
